name: Deploy to EC2

on:
    push:
        branches: [staging]
    workflow_dispatch:
        inputs:
            image_tag:
                description: "Image tag to deploy (defaults to latest commit SHA)"
                required: false
                default: ""

env:
    ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
    ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    IMAGE_TAG: ${{ inputs.image_tag || github.sha }}

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: staging
        permissions:
            id-token: write
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Validate required deploy configuration
              env:
                  V_EC2_TARGET_TAG_KEY: ${{ vars.EC2_TARGET_TAG_KEY }}
                  V_EC2_TARGET_TAG_VALUE: ${{ vars.EC2_TARGET_TAG_VALUE }}
                  V_AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
                  V_AWS_REGION: ${{ vars.AWS_REGION }}
                  V_ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
                  V_ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
                  S_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
              run: |
                  MISSING=""

                  require_env() {
                    if [ -z "$2" ]; then
                      MISSING="${MISSING} $1"
                    fi
                  }

                  # These are needed for the SSM deploy mechanics itself -- missing any
                  # of them fails the pipeline before we touch AWS, not partway through.
                  require_env EC2_TARGET_TAG_KEY "$V_EC2_TARGET_TAG_KEY"
                  require_env EC2_TARGET_TAG_VALUE "$V_EC2_TARGET_TAG_VALUE"
                  require_env AWS_DEPLOY_ROLE_ARN "$V_AWS_DEPLOY_ROLE_ARN"
                  require_env AWS_REGION "$V_AWS_REGION"
                  require_env ECR_REGISTRY "$V_ECR_REGISTRY"
                  require_env ECR_REPOSITORY "$V_ECR_REPOSITORY"

                  # OPENAI_API_KEY defaults to "" in the_server.py rather than raising at
                  # boot, so a missing key wouldn't crash-loop the container -- but it would
                  # silently ship a deploy where the core chat functionality can't work, so
                  # it's still worth failing the pipeline over.
                  require_env OPENAI_API_KEY "$S_OPENAI_API_KEY"

                  if [ -n "$MISSING" ]; then
                    echo "Missing required GitHub variables/secrets:${MISSING}" >&2
                    exit 1
                  fi

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Write user_functions.env into build context
              run: |
                  cat > resources/functions/user_functions.env << 'FUNCEOF'
                  JURIS_MCP_URL=${{ vars.JURIS_MCP_URL }}
                  UK_LEGAL_MCP_URL=${{ vars.UK_LEGAL_MCP_URL }}
                  LEGAL_S3_BUCKET_NAME=${{ vars.LEGAL_S3_BUCKET_NAME }}
                  AWS_REGION=${{ vars.AWS_REGION }}
                  AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  GARMENTS_API_BASE=${{ secrets.GARMENTS_API_BASE }}
                  GARMENTS_API_KEY=${{ secrets.GARMENTS_API_KEY }}
                  OUTFITS_API_BASE=${{ secrets.OUTFITS_API_BASE }}
                  COSMETICS_API_BASE=${{ secrets.COSMETICS_API_BASE }}
                  GOOGLE_PLACES_API_KEY=${{ secrets.GOOGLE_PLACES_API_KEY }}
                  ILOVELAWYER_API_BASE=${{ secrets.ILOVELAWYER_API_BASE }}
                  CHAT_WONDER_API_KEY=${{ secrets.CHAT_WONDER_API_KEY }}
                  FUNCEOF

            - name: Build and push Docker image
              run: |
                  docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
                  docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
                  docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
                  docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

            # Env content is base64-encoded and embedded directly in the SSM command below
            # (matching the hris-api deploy) rather than staged through S3. Base64 keeps
            # quotes/$/backticks in secret values from being interpreted as shell syntax
            # while the script is assembled and while it runs on the instance.
            #
            # Security note: this means secrets travel through, and are retained in, AWS's
            # SSM command history -- readable by any principal with
            # ssm:GetCommandInvocation/ListCommands on this account. Narrower than shipping
            # them over SSH, but not as tight as a KMS-gated secret store. Content is never
            # printed to GitHub Actions logs.
            - name: Build SSM deploy script
              run: |
                  mkdir -p /tmp/deploy-env/resources/functions

                  cat > /tmp/deploy-env/.env << 'ENVEOF'
                  OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
                  CHAT_MODEL=${{ vars.CHAT_MODEL }}
                  LEGAL_CHAT_MODEL=${{ vars.LEGAL_CHAT_MODEL }}
                  LEGAL_REASONING_EFFORT=${{ vars.LEGAL_REASONING_EFFORT }}
                  JURIS_MCP_URL=${{ vars.JURIS_MCP_URL }}
                  UK_LEGAL_MCP_URL=${{ vars.UK_LEGAL_MCP_URL }}
                  LEGAL_S3_BUCKET_NAME=${{ vars.LEGAL_S3_BUCKET_NAME }}
                  AWS_REGION=${{ vars.AWS_REGION }}
                  AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  COSMETICS_MODEL=${{ secrets.COSMETICS_MODEL }}
                  COSMETICS_S3_BUCKET_NAME=${{ secrets.COSMETICS_S3_BUCKET_NAME }}
                  COSMETICS_AWS_REGION=${{ secrets.COSMETICS_AWS_REGION }}
                  COSMETICS_API_BASE=${{ secrets.COSMETICS_API_BASE }}
                  GARMENTS_API_BASE=${{ secrets.GARMENTS_API_BASE }}
                  GARMENTS_API_KEY=${{ secrets.GARMENTS_API_KEY }}
                  OUTFITS_API_BASE=${{ secrets.OUTFITS_API_BASE }}
                  GOOGLE_PLACES_API_KEY=${{ secrets.GOOGLE_PLACES_API_KEY }}
                  TAILOR_S3_BUCKET_NAME=${{ vars.TAILOR_S3_BUCKET_NAME }}
                  TAILOR_AWS_REGION=${{ vars.TAILOR_AWS_REGION }}
                  ENVEOF

                  cat > /tmp/deploy-env/resources/functions/user_functions.env << 'FUNCEOF'
                  JURIS_MCP_URL=${{ vars.JURIS_MCP_URL }}
                  UK_LEGAL_MCP_URL=${{ vars.UK_LEGAL_MCP_URL }}
                  LEGAL_S3_BUCKET_NAME=${{ vars.LEGAL_S3_BUCKET_NAME }}
                  AWS_REGION=${{ vars.AWS_REGION }}
                  AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  GARMENTS_API_BASE=${{ secrets.GARMENTS_API_BASE }}
                  GARMENTS_API_KEY=${{ secrets.GARMENTS_API_KEY }}
                  OUTFITS_API_BASE=${{ secrets.OUTFITS_API_BASE }}
                  COSMETICS_API_BASE=${{ secrets.COSMETICS_API_BASE }}
                  GOOGLE_PLACES_API_KEY=${{ secrets.GOOGLE_PLACES_API_KEY }}
                  ILOVELAWYER_API_BASE=${{ secrets.ILOVELAWYER_API_BASE }}
                  CHAT_WONDER_API_KEY=${{ secrets.CHAT_WONDER_API_KEY }}
                  FUNCEOF

                  ENV_B64=$(base64 -w0 /tmp/deploy-env/.env)
                  FUNC_ENV_B64=$(base64 -w0 /tmp/deploy-env/resources/functions/user_functions.env)

                  cat > /tmp/deploy.sh << SCRIPT
                  set -e

                  # ── Bootstrap: Docker ─────────────────────────────────────────
                  if ! command -v docker &> /dev/null; then
                    sudo dnf install -y docker
                    sudo systemctl enable --now docker
                    sudo usermod -aG docker ec2-user
                  fi

                  # ── Bootstrap: AWS CLI ────────────────────────────────────────
                  if ! command -v aws &> /dev/null; then
                    curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
                    unzip -q /tmp/awscliv2.zip -d /tmp
                    sudo /tmp/aws/install
                    rm -rf /tmp/awscliv2.zip /tmp/aws
                  fi

                  # ── App directories ──────────────────────────────────────────
                  sudo mkdir -p /opt/chat-wonder-v2/resources/functions
                  sudo chown -R ec2-user:ec2-user /opt/chat-wonder-v2

                  # ── Write env files ────────────────────────────────────────────
                  echo "$ENV_B64" | base64 -d | sudo tee /opt/chat-wonder-v2/.env > /dev/null
                  echo "$FUNC_ENV_B64" | base64 -d | sudo tee /opt/chat-wonder-v2/resources/functions/user_functions.env > /dev/null
                  sudo chmod 600 /opt/chat-wonder-v2/.env /opt/chat-wonder-v2/resources/functions/user_functions.env

                  # ── Authenticate EC2 to ECR ───────────────────────────────────
                  aws ecr get-login-password --region ${{ vars.AWS_REGION }} \
                    | docker login --username AWS --password-stdin ${{ vars.ECR_REGISTRY }}

                  # ── Pull latest image ─────────────────────────────────────────
                  docker pull ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:latest

                  # ── Stop and remove old container (ignore error if not running)
                  docker stop chat-wonder-v2 || true
                  docker rm   chat-wonder-v2 || true

                  # ── Start new container ───────────────────────────────────────
                  docker run -d \
                    --name chat-wonder-v2 \
                    --restart unless-stopped \
                    -p 8000:8000 \
                    --env-file /opt/chat-wonder-v2/.env \
                    -v /opt/chat-wonder-v2/resources/functions/user_functions.env:/app/resources/functions/user_functions.env:ro \
                    ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:latest

                  # ── Cleanup ────────────────────────────────────────────────────
                  docker image prune -f
                  SCRIPT

            - name: Send deploy command via SSM
              id: send-command
              env:
                  TAG_KEY: ${{ vars.EC2_TARGET_TAG_KEY }}
                  TAG_VALUE: ${{ vars.EC2_TARGET_TAG_VALUE }}
              run: |
                  jq -n --rawfile cmd /tmp/deploy.sh '{commands: ($cmd | rtrimstr("\n") | split("\n"))}' > /tmp/ssm-params.json

                  COMMAND_ID=$(aws ssm send-command \
                    --document-name "AWS-RunShellScript" \
                    --comment "Deploy chat-wonder-v2 staging ($IMAGE_TAG)" \
                    --targets "Key=tag:${TAG_KEY},Values=${TAG_VALUE}" \
                    --parameters file:///tmp/ssm-params.json \
                    --timeout-seconds 300 \
                    --query "Command.CommandId" --output text)

                  echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
                  echo "Sent SSM command $COMMAND_ID targeting tag:${TAG_KEY}=${TAG_VALUE}"

            - name: Wait for deploy to finish
              env:
                  COMMAND_ID: ${{ steps.send-command.outputs.command_id }}
                  TAG_KEY: ${{ vars.EC2_TARGET_TAG_KEY }}
                  TAG_VALUE: ${{ vars.EC2_TARGET_TAG_VALUE }}
              run: |
                  set -euo pipefail

                  # Give SSM a moment to fan the command out to matching instances.
                  sleep 8

                  for i in $(seq 1 30); do
                    STATUS=$(aws ssm list-commands --command-id "$COMMAND_ID" \
                      --query "Commands[0].Status" --output text 2>/dev/null || echo "Pending")
                    if [ "$STATUS" != "Pending" ] && [ "$STATUS" != "InProgress" ]; then
                      break
                    fi
                    echo "Deploy status: $STATUS (attempt $i/30)"
                    sleep 10
                  done

                  echo "Final command status: $STATUS"

                  FAILED=0
                  INSTANCE_IDS=$(aws ssm list-command-invocations --command-id "$COMMAND_ID" \
                    --query "CommandInvocations[].InstanceId" --output text)

                  if [ -z "$INSTANCE_IDS" ]; then
                    echo "No instances matched tag:${TAG_KEY}=${TAG_VALUE} for this SSM command."
                    exit 1
                  fi

                  for INSTANCE_ID in $INSTANCE_IDS; do
                    echo "::group::Instance $INSTANCE_ID"
                    aws ssm get-command-invocation \
                      --command-id "$COMMAND_ID" \
                      --instance-id "$INSTANCE_ID" \
                      --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
                      --output json > invocation.json
                    cat invocation.json
                    INV_STATUS=$(jq -r ".Status" invocation.json)
                    if [ "$INV_STATUS" != "Success" ]; then
                      FAILED=1
                    fi
                    echo "::endgroup::"
                  done

                  if [ "$FAILED" -ne 0 ]; then
                    echo "One or more instances failed to deploy."
                    exit 1
                  fi

                  echo "Deploy succeeded on: $INSTANCE_IDS"
